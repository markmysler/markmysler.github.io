<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mark Mysler · The Station</title>
    <meta name="description" content="Backend and security engineer, co-founder and CEO of Punto Medio. Explore a pixel-art station where every room is a project, or read the quick view." />
    <meta property="og:title" content="Mark Mysler · The Station" />
    <meta property="og:description" content="Backend and security engineer, co-founder and CEO of Punto Medio." />
    <meta property="og:type" content="website" />
    <link rel="alternate" hreflang="en" href="https://markmysler.github.io/quick/" />
    <link rel="alternate" hreflang="es" href="https://markmysler.github.io/quick/es/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="title" class="title">
      <div class="stars" aria-hidden="true"></div>
      <div class="title-card">
        <h1>Mark Mysler</h1>
        <p class="headline" data-t="headline">Backend &amp; security engineer · Co-founder &amp; CEO, Punto Medio</p>
        <p class="tagline" data-t="tagline">A small station inside my head. Every room is something I built.</p>
        <div class="title-actions">
          <button id="enter" class="btn primary" type="button" data-t="enter">Enter the station</button>
          <a id="quick" class="btn" href="/quick/" data-t="quick">Quick view</a>
        </div>
        <p class="title-links">
          <a id="t-email" href="mailto:myslermark@gmail.com">myslermark@gmail.com</a>
          <a id="t-cv" href="/cv/Mark-Mysler-CV-EN.pdf" download>CV (PDF)</a>
          <a href="https://www.linkedin.com/in/mark-mysler" rel="noopener">LinkedIn</a>
          <a href="https://github.com/markmysler" rel="noopener">GitHub</a>
          <button id="lang" class="btn small" type="button" data-t="otherLang">Español</button>
        </p>
        <p class="controls" data-t="controls">Move with WASD / arrows or click. Press E to interact.</p>
      </div>
    </div>
    <div id="game" aria-hidden="true"></div>
    <noscript>
      <p style="padding: 16px">This site is a small game and needs JavaScript. The <a href="/quick/">quick view</a> works without it.</p>
    </noscript>
  </body>
</html>
